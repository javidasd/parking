services:
  backend:
    image: registry.snappfood.ir/platform/pantheon/parkingapi:v1.1.1
    build: Parking.API
    ports:
      - "5025:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    volumes:
      - parking-data:/data

  frontend:
    image: registry.snappfood.ir/platform/pantheon/parkingweb:v1.1.1
    build: parking-ui
    ports:
      - "5026:80"
    depends_on:
      - backend

volumes:
  parking-data:
