services:
  mysql:
    image: mysql:8.4
    env_file: .env
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  backend:
    image: registry.snappfood.ir/platform/pantheon/parkingapi:v2.0.2
    build: Parking.API
    env_file: .env
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    depends_on:
      - mysql

  frontend:
    image: registry.snappfood.ir/platform/pantheon/parkingweb:v2.0.2
    build: parking-ui
    env_file: .env
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend

volumes:
  mysql-data:
