services:
  backend:
    image: registry.snappfood.ir/platform/pantheon/parkingapi:latest
    ports:
      - "5025:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__Default=Data Source=/data/parking.db
    volumes:
      - parking-data:/data

  frontend:
    image: registry.snappfood.ir/platform/pantheon/parkingweb:latest
    ports:
      - "5026:80"
    depends_on:
      - backend

volumes:
  parking-data:
